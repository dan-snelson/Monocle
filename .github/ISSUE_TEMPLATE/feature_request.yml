name: Feature Request
description: Suggest an improvement for Monocle
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - dan-snelson
body:
  - type: markdown
    attributes:
      value: |
        **Note:** While all requests are welcome, finding available cycles to build a feature we won't use in our own reviews is always challenging.

        Requests that keep Monocle proportionate, evidence-based, and safe around untrusted targets are the easiest to accept.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the reviewer, Mac Admin, or stakeholder pain in concrete terms.
      placeholder: |
        Example: Monocle misses risky patterns in configuration profiles that our scripts install.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what Monocle should do instead.
      placeholder: |
        Example: Add a specialized check that flags embedded credentials and overly broad PPPC grants in `.mobileconfig` files.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Include workarounds, adjacent tools, or partial solutions you already tried.

  - type: dropdown
    id: scope
    attributes:
      label: Which part of the project would this affect most?
      options:
        - New language or script type support
        - New check or pattern (patterns.md, specialized-checks.md)
        - Executive, Security, Manager, or Engineer views
        - Monocle Score / scoring rules
        - Input handling (GitHub URLs, bundles, large targets)
        - Automated scanning (Semgrep)
        - Report output / location
        - Agent support (Claude Code, Codex)
        - Documentation / examples
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      options:
        - Mac Admins
        - Security reviewers
        - Managers / leadership
        - Engineers / maintainers
        - All of the above
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Add sample (sanitized) targets, report excerpts, or constraints.
